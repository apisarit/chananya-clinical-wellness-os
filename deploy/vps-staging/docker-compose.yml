name: cnyos-web-staging

services:
  web:
    image: local/cnyos-web-staging:${CNYOS_RELEASE_SHA:?CNYOS_RELEASE_SHA is required}
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${CNYOS_RELEASE_SHA}
        org.opencontainers.image.title: CNYOS VPS staging web
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:80"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - webapp-network

networks:
  webapp-network:
    external: true
    name: webapp-network
