name: Production real-data admission approval

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type VERIFY_CNYOS_REAL_DATA_ADMISSION_APPROVAL'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cnyos-production-admission-approval
  cancel-in-progress: false

jobs:
  verify-admission-approval:
    name: Verify exact post-deploy and monitoring approval while tenant remains OFF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
      PRODUCTION_RELEASE_ATTESTATION_JSON: ${{ secrets.PRODUCTION_RELEASE_ATTESTATION_JSON }}
      PRODUCTION_ADMISSION_ATTESTATION_JSON: ${{ secrets.PRODUCTION_ADMISSION_ATTESTATION_JSON }}
      CLINICAL_OS_PRODUCTION_CONFIG_JSON: ${{ secrets.CLINICAL_OS_PRODUCTION_CONFIG_JSON }}
      PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_EXPECTED_SUPABASE_PROJECT_REF }}
      PRODUCTION_EXPECTED_CLINIC_ID: ${{ vars.PRODUCTION_EXPECTED_CLINIC_ID }}
      PRODUCTION_EXPECTED_CLINIC_CODE: ${{ vars.PRODUCTION_EXPECTED_CLINIC_CODE }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      PRODUCTION_SITE_HOST: ${{ vars.PRODUCTION_SITE_HOST }}
      EXPECTED_PRODUCTION_HOST: ${{ vars.PRODUCTION_SITE_HOST }}
      PRODUCTION_NETLIFY_SITE_ID: ${{ vars.PRODUCTION_NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      CNYOS_PRODUCTION_SMOKE_ACK: VERIFY_PUBLIC_RELEASE
      CNYOS_PRODUCTION_ADMISSION_APPROVAL_ACK: VERIFY_REAL_DATA_ADMISSION_APPROVAL
      PRODUCTION_PUBLIC_DEPLOYMENT_EVIDENCE_PATH: artifacts/production-admission-approval/public-deployment.json
      PUBLIC_DEPLOYMENT_EVIDENCE_PATH: artifacts/production-admission-approval/public-deployment.json
      PRODUCTION_ADMISSION_APPROVAL_EVIDENCE_PATH: artifacts/production-admission-approval/admission-approval.json
    steps:
      - name: Require explicit admission approval verification intent
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "VERIFY_CNYOS_REAL_DATA_ADMISSION_APPROVAL" || {
            echo 'Admission approval confirmation mismatch.' >&2
            exit 1
          }

      - name: Check out exact selected main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require trusted default branch and exact checkout
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$PRODUCTION_RELEASE_ATTESTATION_JSON"
          test -n "$PRODUCTION_ADMISSION_ATTESTATION_JSON"
          test -n "$PRODUCTION_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$NETLIFY_AUTH_TOKEN"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Re-run complete release contracts
        run: npm run check

      - name: Require protected exact-commit production approval
        run: npm run verify:production-promotion

      - name: Re-attest currently published production runtime
        run: npm run verify:public-deployment

      - name: Verify post-deploy and monitoring admission approval while database remains suspended
        run: npm run verify:production-admission-approval

      - name: Retain admission approval evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cnyos-production-admission-approval-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/production-admission-approval/
          if-no-files-found: warn
          retention-days: 365
