name: Owner recovery exact source snapshots
on:
  push:
    branches: [codex/owner-live-recovery-20260906]
permissions:
  contents: read
jobs:
  exact-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f21d9388217b8bb75632203be11bd490e7051f7a
          persist-credentials: false
      - name: Archive tracked public source only
        shell: bash
        run: |
          git archive --format=tar HEAD > source-current.tar
          git fetch --no-tags --depth=1 origin e0bbe5af485389885c9bce9627fadf9856ca3c71
          git archive --format=tar FETCH_HEAD > source-pr13.tar
          sha256sum source-current.tar source-pr13.tar
      - uses: actions/upload-artifact@v4
        with:
          name: owner-recovery-source-${{ github.run_id }}
          path: source-*.tar
          if-no-files-found: error
          retention-days: 1
