name: Release candidate contracts

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: release-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-database-contracts:
    name: Source + PostgreSQL + release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CNYOS_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CNYOS_RELEASE_REF: ${{ github.event.pull_request.head.ref || github.ref }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CNYOS_RELEASE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run source and PostgreSQL behavioral contracts
        run: npm run check

      - name: Verify rollback-only ledger artifact contract
        run: node tests/migration-ledger-verification-contract.mjs

      - name: Generate guarded staging migration ledger artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/migration-ledger
          for target in cnyos-staging jitarsa-staging; do
            config="config/tenant.${target}.json"
            CLINICAL_OS_SOURCE_COMMIT="${CNYOS_RELEASE_SHA}" \
              node scripts/generate-migration-ledger-verification-sql.mjs "${config}" \
              > "artifacts/migration-ledger/${target}-verification-only.sql"
            CLINICAL_OS_SOURCE_COMMIT="${CNYOS_RELEASE_SHA}" \
              node scripts/generate-migration-ledger-repair-sql.mjs "${config}" \
              > "artifacts/migration-ledger/${target}-guarded-repair.sql"
          done
          (
            cd artifacts/migration-ledger
            sha256sum *.sql > SHA256SUMS
          )

      - name: Retain guarded migration ledger artifacts
        uses: actions/upload-artifact@v6
        with:
          name: migration-ledger-${{ env.CNYOS_RELEASE_SHA }}-${{ github.run_id }}
          path: artifacts/migration-ledger/
          if-no-files-found: error
          retention-days: 90

      - name: Generate exact-commit evidence
        if: always()
        run: npm run evidence:release
        env:
          RELEASE_EVIDENCE_DIR: artifacts/release-evidence

      - name: Retain exact-commit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-contracts-${{ env.CNYOS_RELEASE_SHA }}-${{ github.run_id }}
          path: artifacts/release-evidence/
          if-no-files-found: error
          retention-days: 90
