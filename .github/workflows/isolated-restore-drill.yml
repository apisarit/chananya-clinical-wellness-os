name: Isolated managed restore drill

on:
  workflow_dispatch:
    inputs:
      source_environment:
        description: Backup source environment
        required: true
        type: choice
        options: [staging, production]
      source_clinic_code:
        description: Exact source clinic code
        required: true
        type: string
      backup_slot:
        description: Backup slot in ISO-8601 UTC
        required: true
        type: string
      restore_started_at:
        description: Managed restore start time in ISO-8601 UTC
        required: true
        type: string
      managed_restore_change_reference:
        description: Reviewed restore/PITR change or ticket reference
        required: true
        type: string
      expect_complete_chain:
        description: Require at least one restored Encounter-to-Payment chain
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: isolated-managed-restore-drill
  cancel-in-progress: false

jobs:
  verify-isolated-restore:
    name: Encrypted set + restored database integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: restore-test
    env:
      RESTORE_DRILL_ACK: ISOLATED_RESTORE_TEST_ONLY
      RESTORE_SOURCE_ENVIRONMENT: ${{ inputs.source_environment }}
      RESTORE_SOURCE_CLINIC_CODE: ${{ inputs.source_clinic_code }}
      RESTORE_BACKUP_SLOT: ${{ inputs.backup_slot }}
      RESTORE_STARTED_AT: ${{ inputs.restore_started_at }}
      RESTORE_CHANGE_REFERENCE: ${{ inputs.managed_restore_change_reference }}
      RESTORE_EXPECT_COMPLETE_CHAIN: ${{ inputs.expect_complete_chain }}
      RESTORE_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
      RESTORE_SET_DIR: artifacts/restore-drill/encrypted
      RESTORE_EVIDENCE_DIR: artifacts/restore-drill/evidence
      BACKUP_ENCRYPTION_KEY_BASE64: ${{ secrets.BACKUP_ENCRYPTION_KEY_BASE64 }}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_PATIENTS_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_PATIENTS_FOLDER_ID }}
      GOOGLE_DRIVE_PRODUCTS_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_PRODUCTS_FOLDER_ID }}
      GOOGLE_DRIVE_PHARMACY_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_PHARMACY_FOLDER_ID }}
      GOOGLE_DRIVE_TRANSACTIONS_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_TRANSACTIONS_FOLDER_ID }}
      CLINICAL_OS_RESTORE_TEST_CONFIG_JSON: ${{ secrets.CLINICAL_OS_RESTORE_TEST_CONFIG_JSON }}
      CLINICAL_OS_PRODUCTION_CONFIG_JSON: ${{ secrets.CLINICAL_OS_PRODUCTION_CONFIG_JSON }}
      RESTORE_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RESTORE_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run source and PostgreSQL behavioral contracts
        run: npm run check

      - name: Fetch the exact four encrypted Drive objects
        run: npm run restore:fetch

      - name: Verify encryption, integrity, table coverage and source binding
        run: npm run restore:verify-set -- "$RESTORE_SET_DIR"

      - name: Resolve generated restore-set evidence path
        run: |
          RESTORE_FILE="$(find "$RESTORE_EVIDENCE_DIR" -maxdepth 1 -type f -name 'restore-set-*.json' -print -quit)"
          test -n "$RESTORE_FILE"
          echo "RESTORE_SET_EVIDENCE_PATH=$RESTORE_FILE" >> "$GITHUB_ENV"

      - name: Verify isolated managed restore and measure RPO/RTO
        run: npm run restore:verify-database

      - name: Generate exact-commit evidence
        if: always()
        run: npm run evidence:release
        env:
          RELEASE_EVIDENCE_DIR: artifacts/restore-drill/release

      - name: Retain non-PHI restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-restore-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/restore-drill/evidence/
            artifacts/restore-drill/release/
          if-no-files-found: warn
          retention-days: 365
