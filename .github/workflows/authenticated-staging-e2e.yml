name: Unprivileged CNYOS staging candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnyos-staging-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-evidence:
    name: Offline contracts and immutable candidate inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a fresh manual evidence run
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_ACTOR"

      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Bind the exact candidate source
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "CLINICAL_OS_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          echo "CLINICAL_OS_BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "CNYOS_STAGING_FUNCTION_SOURCE_TREE=$(git rev-parse 'HEAD:netlify/functions')" >> "$GITHUB_ENV"

      - name: Install locked candidate dependencies without deployment credentials
        run: npm ci

      - name: Install the pinned browser binary without deployment credentials
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run all offline source and database behavioral contracts
        run: npm run check

      - name: Build a database-locked staging candidate from tracked inputs
        run: npm run build:staging-artifact
        env:
          CONTEXT: production
          URL: https://cnyos.netlify.app
          CLINICAL_OS_STAGING_DEPLOYMENT: "true"
          CLINICAL_OS_TENANT_CONFIG_PATH: config/tenant.cnyos-staging.json
          CLINICAL_OS_SOURCE_COMMIT: ${{ github.sha }}
          CLINICAL_OS_REQUIRE_SOURCE_COMMIT: "true"

      - name: Materialize Function inputs only from the exact Git tree
        run: >-
          node scripts/materialize-staging-functions.mjs
          --output artifacts/staging-candidate/functions
          --manifest artifacts/staging-candidate/function-input-manifest.json

      - name: Prove candidate scripts did not mutate tracked source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CLINICAL_OS_SOURCE_TREE"
          test "$(git rev-parse 'HEAD:netlify/functions')" = "$CNYOS_STAGING_FUNCTION_SOURCE_TREE"

      - name: Retain immutable unprivileged candidate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v6
        with:
          name: cnyos-staging-candidate-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/
            artifacts/staging-candidate/functions/
            artifacts/staging-candidate/function-input-manifest.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Report the candidate evidence
        shell: bash
        run: |
          test -n "$ARTIFACT_DIGEST"
          echo "Candidate commit: $GITHUB_SHA"
          echo "Candidate tree: $CLINICAL_OS_SOURCE_TREE"
          echo "Candidate artifact SHA-256: $ARTIFACT_DIGEST"
          echo "No Netlify, database service-role, tenant-config secret, or patient credential was available."
        env:
          ARTIFACT_DIGEST: ${{ steps.candidate_artifact.outputs.artifact-digest }}
