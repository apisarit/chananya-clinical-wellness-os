name: LINE staging E2E protected-controller handoff

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnyos-line-staging-controller-handoff
  cancel-in-progress: false

jobs:
  protected-controller-required:
    name: Reject credentialed testing from the candidate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed and identify the protected execution boundary
        shell: bash
        run: |
          echo 'LINE staging E2E is disabled in this candidate-controlled repository.' >&2
          echo 'Run it only from the separately protected CNYOS staging deployment controller.' >&2
          echo 'No GitHub Environment, Netlify token, Supabase key, LINE token, or test password was exposed.' >&2
          exit 1
