<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173f31">
  <title>เข้าสู่ระบบ — Chananya Clinical OS</title>
  <script src="tenant-config.js?v=white-label1"></script>
  <script src="tenant-brand.js?v=white-label1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-config.js?v=login1"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#123d2e,#1d684e);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#173f31;padding:24px}.card{width:min(100%,560px);background:#fff;border-radius:32px;padding:42px 28px;box-shadow:0 24px 80px rgba(0,0,0,.22);text-align:center}.logo{width:112px;height:112px;border-radius:28px;background:#174f3d;color:#fff;display:grid;place-items:center;margin:0 auto 26px;font-size:52px;font-weight:700}.card h1{font-size:clamp(30px,7vw,48px);margin:0 0 14px}.card p{font-size:20px;color:#718078;margin:0 0 28px;line-height:1.55}.btn{width:100%;border:0;border-radius:18px;background:#174f3d;color:#fff;padding:18px 20px;font-size:22px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.status{min-height:30px;margin-top:18px;color:#718078}.error{color:#a63838}.note{font-size:14px!important;margin-top:24px!important;color:#87938d!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">ช</div>
    <h1 data-brand-app-name>Chananya Clinical OS</h1>
    <p>เข้าสู่ระบบด้วยบัญชี Google ที่ได้รับอนุญาต</p>
    <button class="btn" id="google-login">เข้าสู่ระบบด้วย Google</button>
    <div class="status" id="status">พร้อมเข้าสู่ระบบ</div>
    <p class="note">ผู้ใช้ใหม่จะได้รับสิทธิ์ตามที่ Admin หรือ Super Admin กำหนด</p>
  </main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const button=document.getElementById('google-login');
  try{
    const cfg=window.CHANANYA_AUTH||{};
    if(!window.supabase||!cfg.url||!cfg.anonKey) throw new Error('ไม่พบ Supabase configuration');
    const client=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const sessionResult=await client.auth.getSession();
    if(sessionResult.data.session){location.replace('/');return;}
    button.addEventListener('click',async()=>{
      button.disabled=true;
      status.className='status';
      status.textContent='กำลังเปิด Google…';
      const result=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/auth-callback.html'}});
      if(result.error){button.disabled=false;status.className='status error';status.textContent=result.error.message;}
    });
  }catch(error){button.disabled=true;status.className='status error';status.textContent=error.message;}
})();
</script>
</body>
</html>
