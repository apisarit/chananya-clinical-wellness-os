<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กำลังเข้าสู่ระบบ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-config.js"></script></head><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#173f31;color:white;font-family:system-ui"><main style="text-align:center"><h2>กำลังยืนยันตัวตน…</h2><p id="status">โปรดรอสักครู่</p><p id="error" style="color:#ffd0d0"></p></main><script>const c=supabase.createClient(window.CHANANYA_AUTH.supabaseUrl,window.CHANANYA_AUTH.publishableKey,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});(async()=>{try{const code=new URLSearchParams(location.search).get('code');if(!code)throw new Error('Missing authorization code');const r=await c.auth.exchangeCodeForSession(code);if(r.error)throw r.error;history.replaceState({},document.title,'/auth-callback.html');document.getElementById('status').textContent='เข้าสู่ระบบสำเร็จ';location.replace('/index.html')}catch(e){document.getElementById('status').textContent='เข้าสู่ระบบไม่สำเร็จ';document.getElementById('error').textContent=e.message;setTimeout(()=>location.replace('/login-v3.html'),4000)}})();</script></body></html>
