<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title description">
  <title id="title">แผนที่ร่างกายสำหรับบันทึกตำแหน่งอาการ</title>
  <desc id="description">ภาพบุคคลผู้ใหญ่ในมุมด้านหน้า ด้านหลัง ด้านซ้าย และด้านขวา</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cfb5"/>
      <stop offset="0.55" stop-color="#e9b995"/>
      <stop offset="1" stop-color="#dca681"/>
    </linearGradient>
    <linearGradient id="skinSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a17d"/>
      <stop offset="0.52" stop-color="#efc3a3"/>
      <stop offset="1" stop-color="#d9a17d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f1f6f2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173f34" flood-opacity="0.10"/>
    </filter>
    <style>
      .panel{fill:url(#panel);stroke:#dce7e1;stroke-width:1}
      .skin{fill:url(#skin);stroke:#6f5547;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
      .side-skin{fill:url(#skinSide);stroke:#6f5547;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
      .hair{fill:#3d302a;stroke:#3d302a;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
      .feature{fill:none;stroke:#8b6857;stroke-width:1.15;stroke-linecap:round;opacity:.76}
      .guide{fill:none;stroke:#9db9ae;stroke-width:1;stroke-linecap:round;stroke-dasharray:3 4;opacity:.7}
      .joint{fill:#fff;stroke:#9db9ae;stroke-width:1;opacity:.62}
    </style>
  </defs>

