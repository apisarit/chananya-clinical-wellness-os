<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173f31">
<title>เข้าสู่ระบบ | Chananya Clinical OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;background:linear-gradient(135deg,#102e24,#245b46);color:#1c2822}.card{width:min(430px,94vw);background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.3);text-align:center}.logo{width:70px;height:70px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:#173f31;color:#fff;font-size:38px}h1{margin:0 0 8px;font-size:27px}p{color:#6f7b75;line-height:1.55}.btn{width:100%;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;background:#173f31;color:#fff;margin-top:16px}.btn:disabled{opacity:.6;cursor:wait}.status{margin-top:14px;font-size:13px;color:#6f7b75}.error{margin-top:12px;color:#b14949;font-size:13px}.privacy{margin-top:18px;font-size:12px;color:#6f7b75}
</style>
</head>
<body>
<main class="card">
<div class="logo">ช</div>
<h1>Chananya Clinical OS</h1>
<p>เข้าสู่ระบบด้วยบัญชี Google ที่ได้รับอนุญาต</p>
<button class="btn" id="login">เข้าสู่ระบบด้วย Google</button>
<div class="status" id="status">พร้อมเข้าสู่ระบบ</div>
<div class="error" id="error"></div>
<div class="privacy">Secure pilot authentication</div>
</main>
<script>
const SUPABASE_URL='https://qptxnrldzzinlcabudjv.supabase.co';
const SUPABASE_KEY='sb_publishable_YCIY8LZeCfRgcSZYgmP6JA_r9OVbpcJ';
const login=document.getElementById('login'),statusEl=document.getElementById('status'),errorEl=document.getElementById('error');
let client;
try{
 if(!window.supabase) throw new Error('โหลดระบบยืนยันตัวตนไม่สำเร็จ กรุณารีเฟรชหน้า');
 client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}catch(e){errorEl.textContent=e.message;}
const timeout=(ms)=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('ตรวจสอบ session เกินเวลา')),ms));
async function openApp(){
 if(!client)return;
 try{
  const result=await Promise.race([client.auth.getSession(),timeout(5000)]);
  const session=result?.data?.session;
  if(session){statusEl.textContent='เข้าสู่ระบบแล้ว กำลังเปิดระบบ…';location.replace('/index.html');return;}
  statusEl.textContent='ยังไม่ได้เข้าสู่ระบบ';
 }catch(e){statusEl.textContent='พร้อมเข้าสู่ระบบ';errorEl.textContent='';}
}
login.onclick=async()=>{
 if(!client){errorEl.textContent='ระบบยืนยันตัวตนยังไม่พร้อม กรุณารีเฟรชหน้า';return;}
 login.disabled=true;errorEl.textContent='';statusEl.textContent='กำลังเปิด Google…';
 try{
  const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://chananya.netlify.app/'}});
  if(error)throw error;
 }catch(e){errorEl.textContent=e.message||'เข้าสู่ระบบไม่สำเร็จ';statusEl.textContent='ลองอีกครั้ง';login.disabled=false;}
};
if(client){client.auth.onAuthStateChange((event,session)=>{if(session)location.replace('/index.html')});openApp();}
</script>
</body>
</html>
